<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/libertinus-regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/libertinus-bold.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Apply a saved theme before first paint; with none saved, the CSS follows the system setting.
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
			} catch {
				// Storage blocked: follow the system setting.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
